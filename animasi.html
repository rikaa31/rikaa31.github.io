<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi 3D</title>
  
  <!-- ========================================== -->
  <!-- BAGIAN STYLESHEET (CSS)                   -->
  <!-- ========================================== -->
  <style>
    /* ------------------------------------------ */
    /* 1. Pengaturan Dasar (Reset CSS & Body)     */
    /* ------------------------------------------ */
    * {
      box-sizing: border-box; /* Padding dan border terhitung di dalam ukuran total elemen */
      margin: 0;             /* Menghapus margin bawaan browser */
      padding: 0;            /* Menghapus padding bawaan browser */
    }

    body {
      /* Background putih bersih dengan pencahayaan gradasi halus merah marun & hitam di pojok */
      background: #ffffff radial-gradient(circle at 10% 10%, rgba(128, 18, 10, 0.08) 0%, transparent 40%),
                             radial-gradient(circle at 90% 90%, rgba(0, 0, 0, 0.06) 0%, transparent 40%);
      background-attachment: fixed; /* Latar tetap tenang saat di-scroll */
      color: #1a1a1a;            /* Warna teks disesuaikan menjadi gelap agar kontras */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Jenis font utama */
      padding: 20px 20px 40px;   /* Ruang bagian atas, samping, dan bawah */
      display: flex;
      flex-direction: column;    /* Menyusun elemen navbar dan container secara vertikal */
      align-items: center;       /* Memposisikan seluruh konten di tengah layar */
      min-height: 100vh;
    }

    /* ------------------------------------------ */
    /* 2. Style Menu Navigasi (Aksen Merah/Hitam) */
    /* ------------------------------------------ */
    nav {
      display: flex;
      justify-content: center;   /* Meratakan menu di tengah */
      gap: 15px;                 /* Jarak antar opsi link navigasi */
      margin-bottom: 30px;       /* Jarak navigasi ke judul di bawahnya */
      padding: 10px 20px;
      background: rgba(128, 18, 10, 0.05); /* Latar transparan nuansa merah marun */
      backdrop-filter: blur(10px);          /* Efek buram pada latar belakang */
      border: 1px solid rgba(128, 18, 10, 0.15); /* Akses garis tepi merah halus */
      border-radius: 30px;                  /* Sudut melengkung halus (bentuk kapsul) */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    nav a {
      text-decoration: none;     /* Menghapus garis bawah pada link */
      color: #80120a;            /* Warna teks link (merah marun) */
      font-weight: 600;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease; /* Efek transisi halus saat disorot kursor */
    }

    /* Efek hover dan penanda menu yang sedang aktif */
    nav a:hover, nav a.active {
      color: #ffffff;            /* Warna teks berubah jadi putih */
      background-color: #80120a; /* Latar berubah jadi merah marun solid */
      box-shadow: 0 4px 10px rgba(128, 18, 10, 0.3);
    }

    /* ------------------------------------------ */
    /* 3. Style Pembungkus Halaman (Container)   */
    /* ------------------------------------------ */
    .container {
      max-width: 500px;          /* Membatasi lebar maksimum halaman agar rapi */
      width: 100%;
      text-align: center;
    }

    /* Judul Utama "Animasi 3D" */
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace; /* Style font gaya retro/tech */
      color: #80120a;                                 /* Warna utama merah marun */
      -webkit-text-stroke: 1.5px #000000;             /* Garis tepi teks berwarna hitam tegas */
    }

    /* ------------------------------------------ */
    /* 4. Style Galeri Video Horizontal           */
    /* ------------------------------------------ */
    .video-list-horizontal {
      display: flex;
      flex-direction: row;       /* Menyusun video ke samping (horizontal) */
      gap: 15px;                 /* Jarak antar video */
      overflow-x: auto;          /* Mengaktifkan scroll ke samping jika video melebihi lebar */
      padding-bottom: 15px;      /* Ruang bawah untuk scrollbar */
      margin-bottom: 30px;
      scroll-snap-type: x mandatory; /* Efek magnet halus saat di-scroll */
      -webkit-overflow-scrolling: touch;
    }

    /* Kustomisasi Tampilan Scrollbar (Merah & Hitam) */
    .video-list-horizontal::-webkit-scrollbar {
      height: 8px;
    }
    .video-list-horizontal::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }
    .video-list-horizontal::-webkit-scrollbar-thumb {
      background: #80120a;       /* Scrollbar merah marun */
      border-radius: 10px;
    }

    .video-item {
      flex: 0 0 85%;             /* Setiap video mengambil 85% lebar container agar porsi video berikutnya terlihat */
      height: 280px;
      background: #000000;       /* Latar dalam video tetap hitam pekat agar kontras */
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #80120a;  /* Bingkai aksen merah marun */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); /* Bayangan hitam lembut */
      scroll-snap-align: center;  /* Mengunci video di tengah saat di-scroll */
    }

    .video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;         /* Video memenuhi frame secara presisi */
      display: block;
    }

    /* ------------------------------------------ */
    /* 5. Style Deskripsi Proyek                  */
    /* ------------------------------------------ */
    .description {
      font-size: 14px;
      line-height: 1.6;          /* Jarak antar baris teks agar enak dibaca */
      text-align: left;         /* Teks deskripsi rata kiri */
      color: #2c2c2c;            /* Warna hitam gelap yang nyaman dibaca di latar putih */
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #80120a; /* Aksen garis merah marun tegas di sebelah kiri */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- BAGIAN KONTEN UTAMA (HTML)                -->
  <!-- ========================================== -->

  <!-- Menu Navigasi Utama -->
  <nav>
    <a href="index.html">Beranda</a>
    <a href="uiux.html">UI/UX Design</a>
    <a href="animasi.html" class="active">Animasi 3D</a> <!-- Link Aktif -->
    <a href="iot.html">IoT</a>
    <a href="web.html">Front End</a>
  </nav>

  <!-- Pembungkus Konten Utama -->
  <div class="container">

    <!-- Judul Halaman -->
    <h1 class="main-title">Animasi 3D</h1>

    <!-- Daftar 5 Video Horizontal -->
    <div class="video-list-horizontal">
      <!-- Video 1 -->
      <div class="video-item">
        <video src="asset/logo.mp4" autoplay loop muted playsinline controls></video>
      </div>

      <!-- Video 2 -->
      <div class="video-item">
        <video src="asset/animasi_1.mp4" autoplay loop muted playsinline controls></video>
      </div>

      <!-- Video 3 -->
      <div class="video-item">
        <video src="asset/animasi_2.mp4" autoplay loop muted playsinline controls></video>
      </div>

      <!-- Video 4 -->
      <div class="video-item">
        <video src="asset/animasi_3.mp4" autoplay loop muted playsinline controls></video>
      </div>

      <!-- Video 5 -->
      <div class="video-item">
        <video src="asset/animasi_4.mp4" autoplay loop muted playsinline controls></video>
      </div>
    </div>

    <!-- Penjelasan singkat mengenai proyek 3D -->
    <p class="description">
      Gantech (Global Advanced Nusa TECHNOLOGY) adalah perusahaan teknologi yang berfokus pada pengembangan solusi perangkat keras dan perangkat lunak untuk gaming dan teknologi modern.
    </p>

  </div> <!-- Akhir container -->

</body>
</html>
