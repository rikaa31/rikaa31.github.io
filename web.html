<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front End Website</title>
  
  <style>
    /* ------------------------------------------ */
    /* 1. Reset CSS & Base Styles                 */
    /* ------------------------------------------ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #ffffff radial-gradient(circle at 10% 15%, rgba(132, 182, 228, 0.18) 0%, transparent 45%),
                         radial-gradient(circle at 90% 85%, rgba(32, 59, 92, 0.12) 0%, transparent 45%);
      background-attachment: fixed;
      color: #0f172a;
      padding: 20px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ------------------------------------------ */
    /* 2. Style Menu Navigasi                     */
    /* ------------------------------------------ */
    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      padding: 10px 20px;
      background: rgba(32, 59, 92, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(32, 59, 92, 0.2);
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(32, 59, 92, 0.08);
      flex-wrap: wrap; /* Menjaga menu tetap rapi jika lebar layar menyempit */
    }

    nav a {
      text-decoration: none;
      color: #203b5c;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    nav a:hover, nav a.active {
      color: #ffffff;
      background-color: #203b5c;
      box-shadow: 0 4px 12px rgba(32, 59, 92, 0.3);
    }

    /* ------------------------------------------ */
    /* 3. Style Pembungkus Utama                  */
    /* ------------------------------------------ */
    .container {
      max-width: 1000px;
      width: 100%;
    }

    .main-title {
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      color: #000000;
      letter-spacing: 2px;
      margin-bottom: 50px;
    }

    /* ------------------------------------------ */
    /* 4. Layout Kartu Showcase & CSS Slider      */
    /* ------------------------------------------ */
    .section-website {
      display: flex;
      gap: 40px;
      align-items: center;
      background: linear-gradient(135deg, #4A82BC 0%, #172D4A 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(23, 45, 74, 0.35);
    }

    /* Container Slider Foto Pure CSS */
    .slider-container {
      width: 520px;
      flex-shrink: 0;
      overflow: hidden; /* Menyembunyikan gambar lain di luar area tampilan */
      border-radius: 12px;
    }

    /* Track / Barisan Gambar Bergerak Otomatis via CSS Animation (7 Gambar) */
    .slides-track {
      display: flex;
      width: 700%; /* Disesuaikan untuk 7 gambar = 700% */
      animation: autoSlide 21s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .slides-track:hover {
      animation-play-state: paused; /* Pause animasi saat cursor hover di gambar */
    }

    .slides-track img {
      width: 14.2857%; /* Setiap gambar mengambil 1/7 bagian (100% / 7 = 14.2857%) */
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
    }

    /* Keyframes Animasi Slide Otomatis 7 Foto */
    @keyframes autoSlide {
      0%, 11.4%    { transform: translateX(0%); }             /* Foto 1 */
      14.28%, 25.6% { transform: translateX(-14.2857%); }    /* Foto 2 */
      28.57%, 39.9% { transform: translateX(-28.5714%); }    /* Foto 3 */
      42.85%, 54.2% { transform: translateX(-42.8571%); }    /* Foto 4 */
      57.14%, 68.5% { transform: translateX(-57.1428%); }    /* Foto 5 */
      71.42%, 82.8% { transform: translateX(-71.4285%); }    /* Foto 6 */
      85.71%, 97.1% { transform: translateX(-85.7142%); }    /* Foto 7 */
      100%          { transform: translateX(0%); }             /* Kembali ke Foto 1 */
    }

    /* ------------------------------------------ */
    /* 5. Deskripsi Teks                          */
    /* ------------------------------------------ */
    .content-box {
      flex: 1;
    }

    .content-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
      line-height: 1.25;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .content-desc {
      font-size: 16px;
      line-height: 1.7;
      color: #e2e8f0;
      text-align: justify;
    }

    /* ------------------------------------------ */
    /* 6. Media Query Responsive (Tablet & HP)    */
    /* ------------------------------------------ */
    @media (max-width: 900px) {
      .section-website {
        flex-direction: column;
        padding: 25px;
        gap: 25px;
      }
      
      .slider-container {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 15px 15px 40px;
      }

      /* Navbar HP */
      nav {
        gap: 8px;
        padding: 8px 12px;
        margin-bottom: 25px;
        border-radius: 20px;
      }

      nav a {
        font-size: 12px;
        padding: 6px 12px;
      }

      /* Judul HP */
      .main-title {
        font-size: 30px;
        margin-bottom: 25px;
        letter-spacing: 1px;
      }

      /* Kartu & Slider HP */
      .section-website {
        padding: 20px;
        border-radius: 16px;
      }

      .content-title {
        font-size: 22px;
        margin-bottom: 12px;
        text-align: center;
      }

      .content-desc {
        font-size: 13.5px;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>

  <!-- Menu Navigasi Utama -->
  <nav>
    <a href="index.html">Beranda</a>
    <a href="uiux.html">UI/UX Design</a>
    <a href="animasi.html">Animasi 3D</a>
    <a href="iot.html">IoT</a>
    <a href="web.html" class="active">Front End</a>
  </nav>

  <!-- Pembungkus Konten Utama -->
  <div class="container">

    <h1 class="main-title">FRONT END WEBSITE</h1>

    <div class="section-website">
      
      <!-- Container Slider Gambar (Pure CSS) -->
      <div class="slider-container">
        <div class="slides-track">
          <img src="asset/log.png" alt="Tampilan 1">
          <img src="asset/1.png" alt="Tampilan 2">
          <img src="asset/2.png" alt="Tampilan 3">
          <img src="asset/3.png" alt="Tampilan 4">
          <img src="asset/4.png" alt="Tampilan 5">
          <img src="asset/5.png" alt="Tampilan 6">
          <img src="asset/6.png" alt="Tampilan 7">
        </div>
      </div>
      
      <!-- Deskripsi Penjelasan Proyek Website -->
      <div class="content-box">
        <h2 class="content-title">Sistem Informasi Tugas Akhir</h2>
        <p class="content-desc">
          Sistem Operasi Tugas Akhir merupakan website yang mempermudah mahasiswa dan dosen dalam mengelola proses pengajuan tugas akhir, mulai dari pengajuan judul hingga tahapan persetujuan.
        </p>
      </div>

    </div>

  </div>

</body>
</html>
